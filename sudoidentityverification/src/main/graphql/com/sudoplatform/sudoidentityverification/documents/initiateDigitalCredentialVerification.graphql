mutation InitiateDigitalCredentialVerification($input: InitiateDigitalCredentialVerificationInput) {
  initiateDigitalCredentialVerification(input: $input) {
    flow {
      ... on DcApiFlowRequest {
        requestJson
      }
      ... on AppleVerifyWithWalletFlowRequest {
        nonce
      }
    }
    expiryAtEpochSeconds
  }
}
